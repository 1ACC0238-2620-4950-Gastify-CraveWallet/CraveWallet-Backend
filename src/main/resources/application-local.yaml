# Perfil de arranque sin Docker. H2 no representa la persistencia final del informe.
# Flujo local confirmado con seller/buyer de prueba: el proveedor devuelve live_mode=true.
MERCADOPAGO_EXPECTED_LIVE_MODE: true
spring:
  datasource:
    url: jdbc:h2:file:./.local-data/cravewallet;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
server:
  address: 127.0.0.1
