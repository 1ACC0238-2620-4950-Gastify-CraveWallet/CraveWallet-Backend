# AV2 web service. PostgreSQL is managed separately and injected through Environment.
services:
  - type: web
    name: cravewallet-api-av2
    runtime: docker
    plan: free
    region: oregon
    branch: feature/av2-premium-backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FLUTTER_WEB_ORIGIN
        value: https://1acc0238-2620-4950-gastify-cravewallet.github.io
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_BACK_URL
        sync: false
